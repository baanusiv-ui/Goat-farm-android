name: Extract Goat Farm and Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p /tmp/goatfarm
          unzip -q Goatgit.zip -d /tmp/goatfarm
          echo "Files found:"
          find /tmp/goatfarm -maxdepth 5 -type f | head -100

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          PROJECT_DIR=$(find /tmp/goatfarm -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "No Gradle settings file found"
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          gradle --no-daemon \
            -p "${{ steps.locate.outputs.project_dir }}" \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoatFarm-debug-APK
          path: /tmp/goatfarm/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
