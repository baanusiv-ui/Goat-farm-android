
name: Extract Goat Farm and Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          set -e
          unzip -q Goatgit.zip -d /tmp/goatfarm
          rsync -a --exclude='GoatFarm.apk' --exclude='GoatFarm.apk.idsig' /tmp/goatfarm/ ./
          rm Goatgit.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GoatFarm-debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
